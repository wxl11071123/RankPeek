<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RankPeek Loading</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        background: #0e0e10;
      }

      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.5s ease;
        -webkit-app-region: drag;
      }

      .logo-scene {
        position: relative;
        width: 300px;
        height: 300px;
        isolation: isolate;
      }

      .logo {
        position: absolute;
        left: 50%;
        width: 200px;
        height: 200px;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }

      .main-logo {
        top: 50%;
        z-index: 2;
        opacity: 0.85;
        filter: brightness(0.9) blur(0.3px);
        transform: translate(-50%, -58%);
        animation: logoWaterPulse 4s ease-in-out infinite;
      }

      .reflection-logo {
        top: calc(50% + 46px);
        z-index: 1;
        opacity: 0.25;
        filter: brightness(0.9) blur(0.7px);
        transform: translateX(-50%) scaleY(-1);
        transform-origin: center top;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.4) 0%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.4) 0%, transparent 100%);
        animation: reflectionWaterPulse 4s ease-in-out infinite;
      }

      .caustics-layer {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 3;
        width: 300px;
        height: 300px;
        pointer-events: none;
        mix-blend-mode: screen;
        transform: translate(-50%, -50%);
      }

      .caustic {
        position: absolute;
        border-radius: 50%;
        opacity: 0.72;
        filter: blur(10px);
        background: radial-gradient(
          ellipse at center,
          rgba(212, 175, 55, 0.08) 0%,
          rgba(212, 175, 55, 0.04) 36%,
          transparent 72%
        );
        transition:
          opacity 1.5s ease-out,
          transform 1.5s ease-out,
          filter 1.5s ease-out;
      }

      .caustic.one {
        top: 40px;
        left: 42px;
        width: 150px;
        height: 94px;
        animation: causticOne 4s ease-in-out infinite;
      }

      .caustic.two {
        right: 36px;
        bottom: 78px;
        width: 172px;
        height: 104px;
        animation: causticTwo 5.5s ease-in-out infinite;
      }

      .caustic.three {
        top: 104px;
        left: 72px;
        width: 190px;
        height: 126px;
        opacity: 0.54;
        animation: causticThree 7s ease-in-out infinite;
      }

      .brand {
        position: fixed;
        left: 50%;
        bottom: 36px;
        color: rgba(212, 175, 55, 0.3);
        font-family: "Noto Serif SC", "Source Han Serif SC", "Times New Roman", serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.3em;
        line-height: 1;
        text-indent: 0.3em;
        transform: translateX(-50%);
        animation: brandPulse 4s ease-in-out infinite;
      }

      body.smooth-exit .main-logo {
        animation: none;
        opacity: 1;
        filter: brightness(1) blur(0);
        transition:
          opacity 1.5s ease-out,
          filter 1.5s ease-out;
      }

      body.smooth-exit .reflection-logo {
        animation: none;
        opacity: 0.4;
        filter: brightness(1) blur(0.3px);
        transition:
          opacity 1.5s ease-out,
          filter 1.5s ease-out;
      }

      body.smooth-exit .caustic {
        animation: none;
        opacity: 0.24;
        filter: blur(14px);
        transform: translate(0, 0) scale(0.92);
      }

      body.quick-exit .main-logo,
      body.quick-exit .reflection-logo,
      body.quick-exit .caustic,
      body.quick-exit .brand {
        animation: none;
      }

      body.fade-out {
        opacity: 0;
      }

      body.quick-fade-out {
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      @keyframes logoWaterPulse {
        0%,
        100% {
          filter: brightness(0.9) blur(0.3px);
        }

        50% {
          filter: brightness(1.05) blur(0.1px);
        }
      }

      @keyframes reflectionWaterPulse {
        0%,
        100% {
          opacity: 0.2;
          filter: brightness(0.88) blur(0.8px);
        }

        50% {
          opacity: 0.3;
          filter: brightness(1.04) blur(0.45px);
        }
      }

      @keyframes causticOne {
        0%,
        100% {
          transform: translate(-9px, 5px) rotate(2deg);
        }

        50% {
          transform: translate(13px, -12px) rotate(-3deg);
        }
      }

      @keyframes causticTwo {
        0%,
        100% {
          transform: translate(14px, -8px) rotate(-5deg);
        }

        50% {
          transform: translate(-13px, 12px) rotate(4deg);
        }
      }

      @keyframes causticThree {
        0%,
        100% {
          transform: translate(-18px, -10px) rotate(4deg);
        }

        50% {
          transform: translate(22px, 16px) rotate(-4deg);
        }
      }

      @keyframes brandPulse {
        0%,
        100% {
          opacity: 0.25;
        }

        50% {
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <main class="logo-scene" aria-label="RankPeek">
      <img src="splash-logo.png" class="logo main-logo" alt="" />
      <img src="splash-logo.png" class="logo reflection-logo" alt="" />
      <div class="caustics-layer" aria-hidden="true">
        <span class="caustic one"></span>
        <span class="caustic two"></span>
        <span class="caustic three"></span>
      </div>
    </main>
    <div class="brand">RankPeek</div>

    <script>
      let exiting = false;

      window.smoothExit = () => {
        if (exiting) {
          return;
        }

        exiting = true;
        document.body.classList.add('smooth-exit');

        setTimeout(() => {
          document.body.classList.add('fade-out');
          setTimeout(() => {
            document.body.style.display = 'none';
          }, 500);
        }, 1800);
      };

      window.quickExit = () => {
        if (exiting) {
          return;
        }

        exiting = true;
        document.body.classList.add('quick-exit');

        requestAnimationFrame(() => {
          document.body.classList.add('quick-fade-out');
          setTimeout(() => {
            document.body.style.display = 'none';
          }, 300);
        });
      };
    </script>
  </body>
</html>
