<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RankPeek Loading</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #181820;
        color: #d4af37;
        font-family: "Noto Serif SC", "Source Han Serif SC", "Times New Roman", serif;
      }

      body {
        display: grid;
        place-items: center;
        -webkit-app-region: drag;
      }

      .ambient {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 50% 34%, rgba(212, 175, 55, 0.11), transparent 34%),
          radial-gradient(circle at 22% 82%, rgba(255, 255, 255, 0.05), transparent 28%);
        pointer-events: none;
      }

      .glass-card {
        width: 320px;
        height: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 40px;
        border: 1px solid rgba(212, 175, 55, 0.15);
        border-radius: 24px;
        background: rgba(24, 24, 32, 0.6);
        text-align: center;
        box-shadow: 0 0 60px rgba(212, 175, 55, 0.1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .logo {
        width: 180px;
        height: 180px;
        object-fit: contain;
        border-radius: 28px;
        animation:
          logoBreathe 3s ease-in-out infinite,
          glowBreathe 3s ease-in-out infinite;
      }

      .app-name {
        color: #d4af37;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.25em;
        line-height: 1.2;
        text-indent: 0.25em;
      }

      .sub-text {
        color: rgba(212, 175, 55, 0.5);
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .loader-bar {
        position: fixed;
        bottom: 40px;
        left: 50%;
        width: 260px;
        height: 2px;
        overflow: hidden;
        border-radius: 1px;
        background: rgba(255, 255, 255, 0.08);
        transform: translateX(-50%);
      }

      .loader-bar-inner {
        width: 0%;
        height: 100%;
        border-radius: 1px;
        background: #d4af37;
        box-shadow: 0 0 16px rgba(212, 175, 55, 0.42);
        animation: loadProgress 2.5s ease-out forwards;
      }

      @keyframes logoBreathe {
        0%,
        100% {
          opacity: 0.9;
          transform: scale(1);
        }

        50% {
          opacity: 1;
          transform: scale(1.01);
        }
      }

      @keyframes glowBreathe {
        0%,
        100% {
          box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        50% {
          box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }
      }

      @keyframes loadProgress {
        0% {
          width: 0%;
        }

        100% {
          width: 90%;
        }
      }
    </style>
  </head>
  <body>
    <div class="ambient"></div>
    <main class="glass-card">
      <img src="splash-logo.png" class="logo" alt="RankPeek" />
      <div class="app-name">RankPeek</div>
      <div class="sub-text">正在读取召唤师峡谷数据...</div>
    </main>
    <div class="loader-bar" aria-hidden="true">
      <div class="loader-bar-inner"></div>
    </div>

    <script>
      window.finishLoading = () => {
        const loader = document.querySelector('.loader-bar-inner');
        const card = document.querySelector('.glass-card');

        if (loader) {
          loader.style.transition = 'width 0.3s ease-out';
          loader.style.width = '100%';
        }

        setTimeout(() => {
          if (card) {
            card.style.opacity = '0';
            card.style.transform = 'scale(1.02)';
            card.style.transition = '0.4s';
          }

          setTimeout(() => {
            document.body.style.display = 'none';
          }, 400);
        }, 300);
      };
    </script>
  </body>
</html>
