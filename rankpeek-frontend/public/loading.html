<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RankPeek Loading</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        background: #0e0e10;
      }

      body {
        position: relative;
        opacity: 1;
        color: #d4af37;
        -webkit-app-region: drag;
      }

      .caustics-layer {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        mix-blend-mode: screen;
      }

      .caustic {
        position: absolute;
        border-radius: 999px;
        opacity: 0.86;
        filter: blur(13px);
        background: radial-gradient(
          ellipse at center,
          rgba(212, 175, 55, 0.16) 0%,
          rgba(212, 175, 55, 0.08) 38%,
          transparent 74%
        );
        transition:
          opacity 1.2s ease-out,
          transform 1.2s ease-out,
          filter 1.2s ease-out;
      }

      .caustic.one {
        top: 28%;
        left: calc(50% - 152px);
        width: 230px;
        height: 136px;
        animation: causticOne 4s ease-in-out infinite;
      }

      .caustic.two {
        top: 36%;
        left: calc(50% - 32px);
        width: 250px;
        height: 152px;
        opacity: 0.7;
        animation: causticTwo 5.5s ease-in-out infinite;
      }

      .caustic.three {
        top: 22%;
        left: calc(50% - 70px);
        width: 282px;
        height: 172px;
        opacity: 0.56;
        animation: causticThree 7s ease-in-out infinite;
      }

      .water-scene {
        position: fixed;
        top: 50vh;
        left: 50%;
        width: 400px;
        height: 390px;
        transform: translate(-50%, -50%);
        isolation: isolate;
      }

      .waterline-ripple {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 2;
        width: 320px;
        height: 38px;
        pointer-events: none;
        opacity: 0.64;
        transform: translate(-50%, -50%);
        background:
          repeating-radial-gradient(
            ellipse at center,
            rgba(212, 175, 55, 0.2) 0 1px,
            transparent 2px 10px
          ),
          linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.24), transparent);
        filter: blur(0.45px);
        mask-image: linear-gradient(to bottom, transparent 0%, #000 36%, #000 62%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 36%, #000 62%, transparent 100%);
        animation: rippleDrift 3.8s ease-in-out infinite;
      }

      .logo-reveal,
      .reflection-reveal {
        position: absolute;
        left: 50%;
        width: 220px;
        height: 220px;
        overflow: hidden;
        transform: translateX(-50%);
        will-change: clip-path, transform;
      }

      .logo-reveal {
        top: calc(50% - 220px);
        z-index: 3;
        clip-path: inset(100% 0 0 0);
        animation: logoRise 2.5s cubic-bezier(0.33, 0.1, 0.36, 1) forwards;
      }

      .reflection-reveal {
        top: calc(50% + 4px);
        z-index: 1;
        clip-path: inset(100% 0 0 0);
        opacity: 0.2;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, transparent 100%);
        animation:
          logoRise 2.5s cubic-bezier(0.33, 0.1, 0.36, 1) forwards,
          reflectionWaterPulse 4s ease-in-out infinite;
      }

      .logo {
        width: 220px;
        height: 220px;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }

      #logo {
        opacity: 0.85;
        filter: brightness(0.9) blur(0.2px);
        animation: logoWaterPulse 4s ease-in-out infinite;
        transition:
          opacity 1.2s ease-out,
          filter 1.2s ease-out;
      }

      #logoReflection {
        opacity: 0.2;
        filter: brightness(0.9) blur(0.6px);
        transform: scaleY(-1);
        transform-origin: center top;
        transition:
          opacity 1.2s ease-out,
          filter 1.2s ease-out;
      }

      #appName {
        position: absolute;
        top: calc(50% + 32px);
        left: 50%;
        z-index: 4;
        width: max-content;
        color: rgba(212, 175, 55, 0.45);
        font-family: "Noto Serif SC", "Source Han Serif SC", "Times New Roman", serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.25em;
        line-height: 1;
        text-indent: 0.25em;
        text-shadow: 0 0 6px rgba(212, 175, 55, 0.3);
        -webkit-text-stroke: 0.5px rgba(212, 175, 55, 0.2);
        clip-path: inset(0 0 100% 0);
        opacity: 0;
        transform: translateX(-50%);
        animation: textDrag 2.5s cubic-bezier(0.33, 0.1, 0.36, 1) forwards;
        transition:
          color 1.2s ease-out,
          opacity 1.2s ease-out,
          text-shadow 1.2s ease-out;
      }

      body.emerge .caustic {
        animation-play-state: paused;
        opacity: 0;
        filter: blur(22px);
        transform: translate(0, 0) scale(0.88);
      }

      body.emerge .waterline-ripple {
        opacity: 0;
        transform: translate(-50%, -50%) scaleX(0.82);
        transition:
          opacity 1.2s ease-out,
          transform 1.2s ease-out;
      }

      body.emerge #logo {
        animation: none;
        opacity: 1;
        filter: brightness(1.1) blur(0);
      }

      body.emerge #logoReflection {
        opacity: 0;
        filter: brightness(1) blur(0);
      }

      body.emerge #appName {
        color: #d4af37;
        opacity: 1;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.32);
      }

      body.quick-exit .logo-reveal,
      body.quick-exit .reflection-reveal,
      body.quick-exit #logo,
      body.quick-exit #logoReflection,
      body.quick-exit #appName,
      body.quick-exit .waterline-ripple,
      body.quick-exit .caustic {
        animation-play-state: paused;
      }

      body.fade-out {
        opacity: 0;
      }

      @keyframes logoRise {
        0% {
          clip-path: inset(100% 0 0 0);
          transform: translateX(-50%) translateY(14px);
        }

        30% {
          clip-path: inset(70% 0 0 0);
          transform: translateX(-50%) translateY(5px);
        }

        40% {
          clip-path: inset(70% 0 0 0);
          transform: translateX(-50%) translateY(5px);
        }

        55% {
          clip-path: inset(85% 0 0 0);
          transform: translateX(-50%) translateY(10px);
        }

        70% {
          clip-path: inset(0 0 0 0);
          transform: translateX(-50%) translateY(-3px);
        }

        100% {
          clip-path: inset(0 0 0 0);
          transform: translateX(-50%) translateY(0);
        }
      }

      @keyframes textDrag {
        0%,
        65% {
          clip-path: inset(0 0 100% 0);
          opacity: 0;
          transform: translateX(-50%) translateY(-18px);
        }

        75% {
          clip-path: inset(0 0 0 0);
          opacity: 0.8;
          transform: translateX(-50%) translateY(4px);
        }

        100% {
          clip-path: inset(0 0 0 0);
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      @keyframes logoWaterPulse {
        0%,
        100% {
          filter: brightness(0.9) blur(0.2px);
        }

        50% {
          filter: brightness(1.05) blur(0.05px);
        }
      }

      @keyframes rippleDrift {
        0%,
        100% {
          opacity: 0.5;
          transform: translate(-50%, -50%) scaleX(0.94) translateX(-6px);
        }

        50% {
          opacity: 0.76;
          transform: translate(-50%, -50%) scaleX(1.04) translateX(7px);
        }
      }

      @keyframes reflectionWaterPulse {
        0%,
        100% {
          opacity: 0.18;
          filter: brightness(0.86) blur(0.8px);
        }

        50% {
          opacity: 0.26;
          filter: brightness(1.02) blur(0.45px);
        }
      }

      @keyframes causticOne {
        0%,
        100% {
          transform: translate(-10px, 6px) rotate(2deg);
        }

        50% {
          transform: translate(14px, -12px) rotate(-3deg);
        }
      }

      @keyframes causticTwo {
        0%,
        100% {
          transform: translate(15px, -8px) rotate(-4deg);
        }

        50% {
          transform: translate(-14px, 13px) rotate(4deg);
        }
      }

      @keyframes causticThree {
        0%,
        100% {
          transform: translate(-18px, -10px) rotate(4deg);
        }

        50% {
          transform: translate(23px, 17px) rotate(-4deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="caustics-layer" aria-hidden="true">
      <span class="caustic one"></span>
      <span class="caustic two"></span>
      <span class="caustic three"></span>
    </div>

    <main class="water-scene" aria-label="RankPeek">
      <div class="waterline-ripple" aria-hidden="true"></div>
      <div class="logo-reveal">
        <img id="logo" class="logo" src="splash-logo.png" alt="" />
      </div>
      <div class="reflection-reveal">
        <img id="logoReflection" class="logo" src="splash-logo.png" alt="" />
      </div>
      <div id="appName">RankPeek</div>
    </main>

    <script>
      let exiting = false;

      window.finishWithLCU = () => {
        if (exiting) {
          return;
        }

        exiting = true;
        document.body.classList.add('emerge');

        setTimeout(() => {
          document.body.style.transition = 'opacity 0.5s ease';
          document.body.classList.add('fade-out');
          setTimeout(() => {
            document.body.style.display = 'none';
          }, 500);
        }, 1500);
      };

      window.finishWithoutLCU = () => {
        if (exiting) {
          return;
        }

        exiting = true;
        document.body.classList.add('quick-exit');
        document.body.style.transition = 'opacity 0.4s ease';

        requestAnimationFrame(() => {
          document.body.classList.add('fade-out');
          setTimeout(() => {
            document.body.style.display = 'none';
          }, 400);
        });
      };

      window.smoothExit = window.finishWithLCU;
      window.quickExit = window.finishWithoutLCU;
    </script>
  </body>
</html>
