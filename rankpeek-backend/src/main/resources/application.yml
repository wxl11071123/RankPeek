server:
  port: 8080
  address: 127.0.0.1
  shutdown: graceful

spring:
  application:
    name: rankpeek-backend

  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 5s

app:
  settings:
    match:
      default-queue-mode: 0
logging:
  level:
    root: INFO
    io.rankpeek: INFO
    org.java_websocket: WARN
  pattern:
    console: "[%d{HH:mm:ss.SSS}] [%thread] %-5level %logger{36} - %msg%n"
