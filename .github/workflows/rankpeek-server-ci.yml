name: RankPeek Server CI

on:
  pull_request:
    paths:
      - "rankpeek-server/**"
      - ".github/workflows/rankpeek-server-ci.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "rankpeek-server/**"
      - ".github/workflows/rankpeek-server-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Maven test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rankpeek-server
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate Ubuntu deploy shell scripts
        run: |
          bash -n deploy/ubuntu/rankpeek-server-preflight.sh
          bash -n deploy/ubuntu/rankpeek-server-smoke.sh
          bash -n deploy/ubuntu/rankpeek-server-ai-smoke.sh
          bash -n deploy/ubuntu/postgres/rankpeek-postgres-backup.sh.example
          bash -n deploy/ubuntu/postgres/rankpeek-postgres-restore-drill.sh.example
          bash -n deploy/ubuntu/monitoring/rankpeek-server-monitor.sh.example

      - name: Run server tests
        run: mvn -B test

      - name: Build deployable server jar
        run: mvn -B -DskipTests package

      - name: Generate server jar checksum
        run: (cd target && sha256sum rankpeek-server-0.1.0.jar > rankpeek-server-0.1.0.jar.sha256)

      - name: Upload server jar artifact
        uses: actions/upload-artifact@v5
        with:
          name: rankpeek-server-jar
          path: |
            rankpeek-server/target/rankpeek-server-0.1.0.jar
            rankpeek-server/target/rankpeek-server-0.1.0.jar.sha256
          if-no-files-found: error
          retention-days: 7
