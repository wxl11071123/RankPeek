name: RankPeek Server CI

on:
  pull_request:
    paths:
      - "rankpeek-server/**"
      - ".github/workflows/rankpeek-server-ci.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "rankpeek-server/**"
      - ".github/workflows/rankpeek-server-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Maven test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rankpeek-server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run server tests
        run: mvn -B test
