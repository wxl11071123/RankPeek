<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RankPeek 邮箱验证码</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif;color:#172033;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7fb;margin:0;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e7edf5;">
            <tr>
              <td style="padding:28px 32px 18px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td style="vertical-align:middle;">
                      <table role="presentation" cellpadding="0" cellspacing="0">
                        <tr>
                          <td width="44" height="44" align="center" style="width:44px;height:44px;border-radius:14px;background:#111827;color:#ffffff;font-size:18px;font-weight:800;line-height:44px;">RP</td>
                          <td style="padding-left:12px;">
                            <div style="font-size:20px;font-weight:800;line-height:1.2;color:#111827;">RankPeek</div>
                            <div style="font-size:12px;line-height:1.5;color:#6b7280;">英雄联盟表现分析助手</div>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:6px 32px 0 32px;">
                <h1 style="margin:0;font-size:22px;line-height:1.4;color:#111827;">完成邮箱验证</h1>
                <p style="margin:12px 0 0 0;font-size:15px;line-height:1.8;color:#4b5563;">你正在注册 RankPeek 账号。请在注册页面输入下面的验证码：</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 32px 8px 32px;">
                <div style="display:inline-block;min-width:220px;padding:18px 24px;border-radius:12px;background:#f8fafc;border:1px solid #dbe5f2;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:6px;color:#0f172a;">{{code}}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 32px 26px 32px;">
                <p style="margin:0;font-size:14px;line-height:1.8;color:#4b5563;">验证码有效期为 <strong>{{expire_minutes}} 分钟</strong>。如果不是你本人操作，可以忽略这封邮件。</p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;background:#f8fafc;border-top:1px solid #e7edf5;">
                <p style="margin:0;font-size:12px;line-height:1.8;color:#6b7280;">为保护账号安全，请不要将验证码转发给他人。RankPeek 工作人员不会向你索要验证码。</p>
              </td>
            </tr>
          </table>
          <div style="max-width:560px;margin:14px auto 0 auto;font-size:12px;line-height:1.7;color:#94a3b8;text-align:center;">© RankPeek. This is an automated message.</div>
        </td>
      </tr>
    </table>
  </body>
</html>
