<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RankPeek 密码重置</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif;color:#172033;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7fb;margin:0;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e7edf5;">
            <tr>
              <td style="padding:28px 32px 18px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td style="vertical-align:middle;">
                      <table role="presentation" cellpadding="0" cellspacing="0">
                        <tr>
                          <td width="44" height="44" align="center" style="width:44px;height:44px;border-radius:14px;background:#111827;color:#ffffff;font-size:18px;font-weight:800;line-height:44px;">RP</td>
                          <td style="padding-left:12px;">
                            <div style="font-size:20px;font-weight:800;line-height:1.2;color:#111827;">RankPeek</div>
                            <div style="font-size:12px;line-height:1.5;color:#6b7280;">账号安全通知</div>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:6px 32px 0 32px;">
                <h1 style="margin:0;font-size:22px;line-height:1.4;color:#111827;">重置你的 RankPeek 密码</h1>
                <p style="margin:12px 0 0 0;font-size:15px;line-height:1.8;color:#4b5563;">我们收到了你的密码重置请求。点击下面的按钮继续设置新密码：</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:26px 32px 18px 32px;">
                <a href="https://api.rankpeek.cn/password-reset/{{token}}" style="display:inline-block;min-width:180px;padding:14px 22px;border-radius:10px;background:#111827;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;text-align:center;">重置密码</a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 26px 32px;">
                <p style="margin:0;font-size:14px;line-height:1.8;color:#4b5563;">链接有效期为 <strong>{{expire_minutes}} 分钟</strong>。如果按钮无法打开，请复制下面的链接到浏览器：</p>
                <p style="margin:12px 0 0 0;word-break:break-all;font-size:12px;line-height:1.7;color:#2563eb;">https://api.rankpeek.cn/password-reset/{{token}}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;background:#f8fafc;border-top:1px solid #e7edf5;">
                <p style="margin:0;font-size:12px;line-height:1.8;color:#6b7280;">如果不是你本人操作，可以忽略这封邮件。你的原密码不会因为收到这封邮件而改变。</p>
              </td>
            </tr>
          </table>
          <div style="max-width:560px;margin:14px auto 0 auto;font-size:12px;line-height:1.7;color:#94a3b8;text-align:center;">© RankPeek. This is an automated message.</div>
        </td>
      </tr>
    </table>
  </body>
</html>
