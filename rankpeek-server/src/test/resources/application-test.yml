server:
  port: 18080

spring:
  application:
    name: rankpeek-server
  datasource:
    url: jdbc:h2:mem:rankpeek_server_test;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
  sql:
    init:
      mode: never

rankpeek:
  server:
    service: rankpeek-server
    mode: test
    version: 0.1.0
    cors:
      allowed-origins: "*"
  auth:
    access-token-secret: rankpeek-test-access-token-secret-change-me
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 2592000
    public-registration-enabled: true
  credits:
    coach-summary-charge-credits: 1
  rate-limit:
    enabled: false
    window-seconds: 60
    auth:
      max-requests: 20
    ai:
      max-requests: 10
  ai:
    enabled: false
    provider: mock
    base-url: https://api.deepseek.com
    model: deepseek-v4-flash
    api-key:
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
    max-tokens: 4096
    temperature: 0.4
  opgg:
    base-url: https://lol-api-champion.op.gg
    user-agent: RankPeek/opgg-test-client
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    max-response-bytes: 2000000
    cache-ttl-seconds: 1800
    cache-enabled: true
    cache-zone: Asia/Shanghai
    cleanup-enabled: true
    cleanup-cron: "0 20 4 * * *"
  cn-meta:
    sync:
      enabled: false
      allow-manual: false
      source: mock
      request-delay-ms: 0
      real-source-enabled: false
      real-endpoint-template: ""
