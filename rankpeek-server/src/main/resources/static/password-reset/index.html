<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RankPeek 密码重置</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      background: #070b12;
      color: #f8fafc;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(53, 166, 255, 0.18), transparent 30%),
        linear-gradient(135deg, #0d1725 0%, #070b12 58%, #0a1412 100%);
    }
    .shell {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 30px 0 80px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 82px;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2da2ff, #78e0c2);
      color: #06111f;
      font-weight: 900;
    }
    .brand strong {
      display: block;
      font-size: 22px;
      line-height: 1.1;
    }
    .brand span {
      color: #9fb0c7;
      font-size: 13px;
    }
    .panel {
      width: min(420px, 100%);
      margin: 0 auto;
      border: 1px solid #24354d;
      background: rgba(14, 22, 35, 0.86);
      border-radius: 8px;
      padding: 26px;
      box-shadow: 0 26px 80px rgba(0, 0, 0, 0.32);
    }
    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
    }
    p {
      margin: 10px 0 22px;
      color: #9fb0c7;
      line-height: 1.65;
      font-size: 14px;
    }
    label {
      display: block;
      color: #cbd5e1;
      font-size: 13px;
      margin: 16px 0 8px;
    }
    input {
      width: 100%;
      height: 42px;
      border: 1px solid #293a52;
      border-radius: 7px;
      background: #0b111b;
      color: #f8fafc;
      padding: 0 12px;
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: #3aa8ff;
      box-shadow: 0 0 0 3px rgba(58, 168, 255, 0.18);
    }
    .password-field {
      position: relative;
    }
    .password-field input {
      padding-right: 44px;
    }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #9fb0c7;
      cursor: pointer;
      transform: translateY(-50%);
    }
    .password-toggle:hover {
      background: rgba(148, 163, 184, 0.12);
      color: #f8fafc;
    }
    .password-toggle svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }
    .primary-button {
      margin-top: 18px;
      height: 38px;
      border: 0;
      border-radius: 7px;
      background: #2389e8;
      color: #fff;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary-button:disabled {
      opacity: 0.62;
      cursor: wait;
    }
    .message {
      min-height: 22px;
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    .message.error {
      color: #fb7185;
    }
    .message.ok {
      color: #5eead4;
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="mark">RP</div>
      <div>
        <strong>RankPeek</strong>
        <span>账号安全</span>
      </div>
    </header>

    <section class="panel">
      <h1>RankPeek 密码重置</h1>
      <p>设置一个新的账号密码。提交成功后，请回到 RankPeek 重新登录。</p>
      <form id="resetForm">
        <label for="passwordInput">新密码</label>
        <div class="password-field">
          <input id="passwordInput" type="password" autocomplete="new-password" minlength="8" required>
          <button class="password-toggle" type="button" data-target="passwordInput" aria-label="显示密码">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <label for="confirmInput">确认新密码</label>
        <div class="password-field">
          <input id="confirmInput" type="password" autocomplete="new-password" minlength="8" required>
          <button class="password-toggle" type="button" data-target="confirmInput" aria-label="显示密码">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <button id="submitButton" class="primary-button" type="submit">更新密码</button>
        <div id="message" class="message"></div>
      </form>
    </section>
  </main>

  <script>
    const message = document.getElementById('message')
    const button = document.getElementById('submitButton')
    const token = decodeURIComponent(window.location.pathname.split('/').filter(Boolean).pop() || '')

    function setMessage(text, type) {
      message.textContent = text
      message.className = `message ${type || ''}`
    }

    document.querySelectorAll('.password-toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const input = document.getElementById(toggle.dataset.target)
        const shouldShow = input.type === 'password'
        input.type = shouldShow ? 'text' : 'password'
        toggle.setAttribute('aria-label', shouldShow ? '隐藏密码' : '显示密码')
      })
    })

    document.getElementById('resetForm').addEventListener('submit', async (event) => {
      event.preventDefault()
      const password = document.getElementById('passwordInput').value
      const confirm = document.getElementById('confirmInput').value
      if (password.length < 8) {
        setMessage('密码至少需要 8 个字符。', 'error')
        return
      }
      if (password !== confirm) {
        setMessage('两次输入的密码不一致。', 'error')
        return
      }

      button.disabled = true
      setMessage('正在更新密码...', '')
      try {
        const response = await fetch('/api/auth/password-reset/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: password })
        })
        const payload = await response.json()
        if (!response.ok || !payload.success) {
          throw new Error(payload.error?.message || '密码重置失败')
        }
        setMessage('密码已更新，请回到 RankPeek 重新登录。', 'ok')
      } catch (error) {
        setMessage(error.message || '密码重置失败，请稍后重试。', 'error')
      } finally {
        button.disabled = false
      }
    })
  </script>
</body>
</html>
