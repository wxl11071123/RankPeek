server:
  port: 18080

spring:
  application:
    name: rankpeek-server
  datasource:
    url: jdbc:h2:mem:rankpeek_server_local;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
  sql:
    init:
      mode: never

rankpeek:
  server:
    service: rankpeek-server
    mode: local-dev
    version: 0.1.0
    cors:
      allowed-origins: ${RANKPEEK_CORS_ALLOWED_ORIGINS:*}
  auth:
    access-token-secret: ${RANKPEEK_AUTH_ACCESS_TOKEN_SECRET:rankpeek-local-dev-access-token-secret-change-me}
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 2592000
    public-registration-enabled: ${RANKPEEK_PUBLIC_REGISTRATION_ENABLED:true}
  credits:
    coach-summary-charge-credits: ${RANKPEEK_CREDITS_COACH_SUMMARY_CHARGE_CREDITS:1}
  rate-limit:
    enabled: ${RANKPEEK_RATE_LIMIT_ENABLED:true}
    window-seconds: ${RANKPEEK_RATE_LIMIT_WINDOW_SECONDS:60}
    auth:
      max-requests: ${RANKPEEK_RATE_LIMIT_AUTH_MAX_REQUESTS:20}
    ai:
      max-requests: ${RANKPEEK_RATE_LIMIT_AI_MAX_REQUESTS:10}
  ai:
    enabled: ${RANKPEEK_AI_ENABLED:false}
    provider: ${RANKPEEK_AI_PROVIDER:mock}
    base-url: ${RANKPEEK_AI_BASE_URL:https://api.deepseek.com}
    model: ${RANKPEEK_AI_MODEL:deepseek-v4-flash}
    api-key: ${RANKPEEK_AI_API_KEY:}
    connect-timeout-ms: ${RANKPEEK_AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${RANKPEEK_AI_READ_TIMEOUT_MS:30000}
    max-tokens: ${RANKPEEK_AI_MAX_TOKENS:4096}
    temperature: ${RANKPEEK_AI_TEMPERATURE:0.4}
  opgg:
    base-url: ${RANKPEEK_OPGG_BASE_URL:https://lol-api-champion.op.gg}
    user-agent: ${RANKPEEK_OPGG_USER_AGENT:RankPeek/opgg-client}
    connect-timeout-ms: ${RANKPEEK_OPGG_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${RANKPEEK_OPGG_READ_TIMEOUT_MS:10000}
    max-response-bytes: ${RANKPEEK_OPGG_MAX_RESPONSE_BYTES:2000000}
    cache-ttl-seconds: ${RANKPEEK_OPGG_CACHE_TTL_SECONDS:1800}
    cache-enabled: ${RANKPEEK_OPGG_CACHE_ENABLED:true}
    cache-zone: ${RANKPEEK_OPGG_CACHE_ZONE:Asia/Shanghai}
    cleanup-enabled: ${RANKPEEK_OPGG_CLEANUP_ENABLED:true}
    cleanup-cron: ${RANKPEEK_OPGG_CLEANUP_CRON:0 20 4 * * *}
  cn-meta:
    sync:
      enabled: false
      allow-manual: false
      source: mock
      cron: "0 30 4 * * *"
      zone: "Asia/Shanghai"
      request-delay-ms: 3000
      max-retries: 2
      stop-on-http-status: [401, 403, 429]
      default-queue-id: 420
      tiers: ["CHALLENGER", "GRANDMASTER", "MASTER", "DIAMOND", "EMERALD", "PLATINUM", "GOLD", "SILVER", "BRONZE", "IRON"]
      roles: ["TOP", "JUNGLE", "MID", "ADC", "SUPPORT"]
      real-source-enabled: false
      real-endpoint-template: ""
      real-time-type: 1
      real-champion-id: 666
      real-data-date-offset-days: 1
      real-tier-code-map:
        CHALLENGER: "0"
        GRANDMASTER: "5"
        MASTER: "6"
        DIAMOND: "10"
        EMERALD: "15"
        PLATINUM: "20"
        GOLD: "30"
        SILVER: "40"
        BRONZE: "50"
        IRON: "80"
      real-user-agent: "RankPeek/dev-public-aggregate-client"
      real-connect-timeout-ms: 5000
      real-read-timeout-ms: 10000
      real-max-response-bytes: 1000000

# Production placeholder only. Do not use a real database URL or secret in this repo.
# Future PostgreSQL example:
# spring.datasource.url: jdbc:postgresql://localhost:5432/rankpeek_server
# spring.datasource.username: rankpeek
# spring.datasource.password: ${RANKPEEK_SERVER_DB_PASSWORD}
# rankpeek.auth.access-token-secret: ${RANKPEEK_AUTH_ACCESS_TOKEN_SECRET}
