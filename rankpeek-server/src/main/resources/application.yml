server:
  port: 18080

spring:
  application:
    name: rankpeek-server
  datasource:
    url: jdbc:h2:mem:rankpeek_server_local;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
  sql:
    init:
      mode: never

rankpeek:
  server:
    service: rankpeek-server
    mode: local-dev
    version: 0.1.0
  auth:
    access-token-secret: ${RANKPEEK_AUTH_ACCESS_TOKEN_SECRET:rankpeek-local-dev-access-token-secret-change-me}
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 2592000
  ai:
    enabled: ${RANKPEEK_AI_ENABLED:false}
    provider: ${RANKPEEK_AI_PROVIDER:mock}
    base-url: ${RANKPEEK_AI_BASE_URL:https://api.deepseek.com}
    model: ${RANKPEEK_AI_MODEL:deepseek-v4-flash}
    api-key: ${RANKPEEK_AI_API_KEY:}
    connect-timeout-ms: ${RANKPEEK_AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${RANKPEEK_AI_READ_TIMEOUT_MS:30000}
    max-tokens: ${RANKPEEK_AI_MAX_TOKENS:800}
    temperature: ${RANKPEEK_AI_TEMPERATURE:0.4}
  cn-meta:
    sync:
      enabled: false
      allow-manual: false
      source: mock
      cron: "0 30 4 * * *"
      zone: "Asia/Shanghai"
      request-delay-ms: 3000
      max-retries: 2
      stop-on-http-status: [401, 403, 429]
      default-queue-id: 420
      tiers: ["IRON", "BRONZE", "SILVER", "GOLD", "PLATINUM", "EMERALD", "DIAMOND", "MASTER_PLUS"]
      roles: ["TOP", "JUNGLE", "MID", "ADC", "SUPPORT"]
      real-source-enabled: false
      real-endpoint-template: ""
      real-time-type: 1
      real-champion-id: 666
      real-data-date-offset-days: 1
      real-tier-code-map:
        PLATINUM: "20"
      real-user-agent: "RankPeek/dev-public-aggregate-client"
      real-connect-timeout-ms: 5000
      real-read-timeout-ms: 10000
      real-max-response-bytes: 1000000

# Production placeholder only. Do not use a real database URL or secret in this repo.
# Future PostgreSQL example:
# spring.datasource.url: jdbc:postgresql://localhost:5432/rankpeek_server
# spring.datasource.username: rankpeek
# spring.datasource.password: ${RANKPEEK_SERVER_DB_PASSWORD}
# rankpeek.auth.access-token-secret: ${RANKPEEK_AUTH_ACCESS_TOKEN_SECRET}
