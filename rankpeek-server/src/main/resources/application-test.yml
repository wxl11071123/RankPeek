server:
  port: 18080

spring:
  application:
    name: rankpeek-server
  datasource:
    url: jdbc:h2:mem:rankpeek_server_test;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
  sql:
    init:
      mode: never

rankpeek:
  server:
    service: rankpeek-server
    mode: test
    version: 0.1.0
  auth:
    access-token-secret: rankpeek-test-access-token-secret-change-me
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 2592000
  cn-meta:
    sync:
      enabled: false
      allow-manual: false
      source: mock
      request-delay-ms: 0
      real-source-enabled: false
      real-endpoint-template: ""
