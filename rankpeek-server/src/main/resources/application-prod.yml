server:
  address: ${RANKPEEK_SERVER_ADDRESS:127.0.0.1}
  port: ${RANKPEEK_SERVER_PORT:18080}
  shutdown: graceful

spring:
  application:
    name: rankpeek-server
  datasource:
    url: ${RANKPEEK_SERVER_DB_URL:jdbc:postgresql://127.0.0.1:5432/rankpeek_server}
    driver-class-name: org.postgresql.Driver
    username: ${RANKPEEK_SERVER_DB_USERNAME:rankpeek}
    password: ${RANKPEEK_SERVER_DB_PASSWORD}
  flyway:
    enabled: true
  sql:
    init:
      mode: never
  lifecycle:
    timeout-per-shutdown-phase: 10s

rankpeek:
  server:
    service: rankpeek-server
    mode: prod
    version: 0.1.0
    cors:
      allowed-origins: ${RANKPEEK_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    access-token-secret: ${RANKPEEK_AUTH_ACCESS_TOKEN_SECRET}
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 2592000
    password-reset-token-ttl-seconds: ${RANKPEEK_AUTH_PASSWORD_RESET_TOKEN_TTL_SECONDS:900}
    password-reset-email:
      enabled: ${RANKPEEK_PASSWORD_RESET_EMAIL_ENABLED:false}
      from: ${RANKPEEK_PASSWORD_RESET_EMAIL_FROM:}
      reset-url-base: ${RANKPEEK_PASSWORD_RESET_URL_BASE:}
      subject: ${RANKPEEK_PASSWORD_RESET_EMAIL_SUBJECT:RankPeek password reset}
    email-verification:
      required: ${RANKPEEK_EMAIL_VERIFICATION_REQUIRED:false}
      code-ttl-seconds: ${RANKPEEK_EMAIL_VERIFICATION_CODE_TTL_SECONDS:900}
      resend-cooldown-seconds: ${RANKPEEK_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
    public-registration-enabled: ${RANKPEEK_PUBLIC_REGISTRATION_ENABLED:false}
    initial-admin:
      enabled: ${RANKPEEK_INITIAL_ADMIN_ENABLED:false}
      email: ${RANKPEEK_INITIAL_ADMIN_EMAIL:}
      password: ${RANKPEEK_INITIAL_ADMIN_PASSWORD:}
      display-name: ${RANKPEEK_INITIAL_ADMIN_DISPLAY_NAME:RankPeek Admin}
  email:
    tencent-ses:
      enabled: ${RANKPEEK_TENCENT_SES_ENABLED:false}
      secret-id: ${RANKPEEK_TENCENT_SES_SECRET_ID:}
      secret-key: ${RANKPEEK_TENCENT_SES_SECRET_KEY:}
      region: ${RANKPEEK_TENCENT_SES_REGION:ap-hongkong}
      endpoint: ${RANKPEEK_TENCENT_SES_ENDPOINT:https://ses.tencentcloudapi.com}
      from-email-address: ${RANKPEEK_TENCENT_SES_FROM_EMAIL:}
      register-subject: ${RANKPEEK_TENCENT_SES_REGISTER_SUBJECT:RankPeek 注册验证码}
      register-template-id: ${RANKPEEK_TENCENT_SES_REGISTER_TEMPLATE_ID:}
      password-reset-subject: ${RANKPEEK_TENCENT_SES_PASSWORD_RESET_SUBJECT:RankPeek 密码重置}
      password-reset-template-id: ${RANKPEEK_TENCENT_SES_PASSWORD_RESET_TEMPLATE_ID:}
      connect-timeout-ms: ${RANKPEEK_TENCENT_SES_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${RANKPEEK_TENCENT_SES_READ_TIMEOUT_MS:10000}
  credits:
    coach-summary-charge-credits: ${RANKPEEK_CREDITS_COACH_SUMMARY_CHARGE_CREDITS:1}
    ai-stream-charge-credits: ${RANKPEEK_CREDITS_AI_STREAM_CHARGE_CREDITS:1}
  rate-limit:
    enabled: ${RANKPEEK_RATE_LIMIT_ENABLED:true}
    window-seconds: ${RANKPEEK_RATE_LIMIT_WINDOW_SECONDS:60}
    auth:
      max-requests: ${RANKPEEK_RATE_LIMIT_AUTH_MAX_REQUESTS:20}
    ai:
      max-requests: ${RANKPEEK_RATE_LIMIT_AI_MAX_REQUESTS:10}
  ai:
    enabled: ${RANKPEEK_AI_ENABLED:false}
    provider: ${RANKPEEK_AI_PROVIDER:mock}
    base-url: ${RANKPEEK_AI_BASE_URL:https://api.deepseek.com}
    model: ${RANKPEEK_AI_MODEL:deepseek-v4-flash}
    api-key: ${RANKPEEK_AI_API_KEY:}
    connect-timeout-ms: ${RANKPEEK_AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${RANKPEEK_AI_READ_TIMEOUT_MS:30000}
    max-tokens: ${RANKPEEK_AI_MAX_TOKENS:4096}
    temperature: ${RANKPEEK_AI_TEMPERATURE:0.4}
  opgg:
    base-url: ${RANKPEEK_OPGG_BASE_URL:https://lol-api-champion.op.gg}
    user-agent: ${RANKPEEK_OPGG_USER_AGENT:RankPeek/opgg-client}
    connect-timeout-ms: ${RANKPEEK_OPGG_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${RANKPEEK_OPGG_READ_TIMEOUT_MS:10000}
    max-response-bytes: ${RANKPEEK_OPGG_MAX_RESPONSE_BYTES:2000000}
    cache-ttl-seconds: ${RANKPEEK_OPGG_CACHE_TTL_SECONDS:1800}
    cache-enabled: ${RANKPEEK_OPGG_CACHE_ENABLED:true}
    cache-zone: ${RANKPEEK_OPGG_CACHE_ZONE:Asia/Shanghai}
    cleanup-enabled: ${RANKPEEK_OPGG_CLEANUP_ENABLED:true}
    cleanup-cron: ${RANKPEEK_OPGG_CLEANUP_CRON:0 20 4 * * *}
  cn-meta:
    sync:
      enabled: ${RANKPEEK_CN_META_SYNC_ENABLED:false}
      allow-manual: ${RANKPEEK_CN_META_SYNC_ALLOW_MANUAL:false}
      source: ${RANKPEEK_CN_META_SYNC_SOURCE:mock}
      cron: ${RANKPEEK_CN_META_SYNC_CRON:0 30 4 * * *}
      zone: ${RANKPEEK_CN_META_SYNC_ZONE:Asia/Shanghai}
      request-delay-ms: ${RANKPEEK_CN_META_SYNC_REQUEST_DELAY_MS:3000}
      max-retries: ${RANKPEEK_CN_META_SYNC_MAX_RETRIES:2}
      stop-on-http-status: ${RANKPEEK_CN_META_SYNC_STOP_ON_HTTP_STATUS:401,403,429}
      default-queue-id: ${RANKPEEK_CN_META_SYNC_DEFAULT_QUEUE_ID:420}
      tiers: ["CHALLENGER", "GRANDMASTER", "MASTER", "DIAMOND", "EMERALD", "PLATINUM", "GOLD", "SILVER", "BRONZE", "IRON"]
      roles: ["ALL"]
      real-source-enabled: ${RANKPEEK_CN_META_REAL_SOURCE_ENABLED:false}
      real-endpoint-template: ${RANKPEEK_CN_META_REAL_ENDPOINT_TEMPLATE:}
      real-time-type: ${RANKPEEK_CN_META_REAL_TIME_TYPE:1}
      real-champion-id: ${RANKPEEK_CN_META_REAL_CHAMPION_ID:666}
      real-data-date-offset-days: ${RANKPEEK_CN_META_REAL_DATA_DATE_OFFSET_DAYS:1}
      real-tier-code-map:
        CHALLENGER: "0"
        GRANDMASTER: "5"
        MASTER: "6"
        DIAMOND: "10"
        EMERALD: "15"
        PLATINUM: "20"
        GOLD: "30"
        SILVER: "40"
        BRONZE: "50"
        IRON: "80"
      real-user-agent: ${RANKPEEK_CN_META_REAL_USER_AGENT:RankPeek/prod-public-aggregate-client}
      real-connect-timeout-ms: ${RANKPEEK_CN_META_REAL_CONNECT_TIMEOUT_MS:5000}
      real-read-timeout-ms: ${RANKPEEK_CN_META_REAL_READ_TIMEOUT_MS:10000}
      real-max-response-bytes: ${RANKPEEK_CN_META_REAL_MAX_RESPONSE_BYTES:1000000}
